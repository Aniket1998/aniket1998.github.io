<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }} | {{ site.affiliation | escape }}{% endif %}</title>
    <meta name="description" content="{{ site.description | escape }}">
    {% if site.keywords %}<meta name="keywords" content="{{ site.keywords | escape }}">{% endif %}
    {% if site.canonical %}<link rel="canonical" href="{{ site.canonical }}">{% endif %}

    <link rel="icon" href="{{ site.favicon | relative_url }}?v=adaptive" type="image/png" sizes="32x32">
    <link rel="icon" href="{{ '/assets/img/1rsb-favicon.svg' | relative_url }}?v=adaptive" type="image/svg+xml" sizes="any">
    <link rel="preload" href="{{ '/assets/fonts/source-sans-3-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <div class="masthead">
          <div class="identity">
            <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
          </div>
          <nav class="site-nav" aria-label="Main navigation">
            <a href="{{ '/' | relative_url }}#about-me">About</a>
            <span class="nav-separator" aria-hidden="true">&middot;</span>
            <a href="{{ '/' | relative_url }}#selected-and-recent-papers">Papers</a>
            <span class="nav-separator" aria-hidden="true">&middot;</span>
            <a href="{{ '/' | relative_url }}#talks">Talks</a>
            {% if site.cv_link %}<span class="nav-separator" aria-hidden="true">&middot;</span><a href="{{ site.cv_link | relative_url }}">CV <span aria-hidden="true">↗</span></a>{% endif %}
          </nav>
        </div>
      </header>

      <main id="main-content" class="page-content" tabindex="-1">
        {{ content }}
      </main>

      <footer class="site-footer">Last Updated {{ site.last_updated | escape }}</footer>
    </div>

    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
